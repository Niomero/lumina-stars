services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: lumina
      POSTGRES_USER: lumina
      POSTGRES_PASSWORD: lumina
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
  backend:
    build: .
    ports:
      - "8080:8080"
    environment:
      DATABASE_URL: postgresql://lumina:lumina@postgres:5432/lumina
      REDIS_URL: redis://redis:6379/0
      DEMO_MODE: "true"
      DEMO_LOGIN_ENABLED: "true"
      SECRET_KEY: local-dev-secret-change
      JWT_SECRET: local-dev-jwt-change
    depends_on:
      - postgres
volumes:
  pgdata:
